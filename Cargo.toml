[package]
name = "vello_hybrid_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
vello_hybrid = "0.2.0"
# vello_hybrid 0.2.0 未重新导出以下 crate，需显式依赖
kurbo = "0.13"
peniko = "0.6"
wgpu = "29.0"
# vello_common 提供 FontData、Glyph、FontEmbolden 等文字渲染类型
vello_common = "0.2"
# glifo 提供 Glyph、FontEmbolden 等文字渲染类型
glifo = "0.3"

[dev-dependencies]
# 用于 headless 渲染示例：阻塞式 wgpu 初始化
pollster = "0.3"
# 用于保存渲染结果为 PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# 用于文字渲染示例：字体解析与字形布局（与 vello_hybrid 依赖版本对齐）
skrifa = "0.44"
# 用于 dash_pattern 等 SmallVec 类型
smallvec = "1.13"

[[example]]
name = "01_basic_shapes"
path = "examples/01_basic_shapes.rs"

[[example]]
name = "02_transforms"
path = "examples/02_transforms.rs"

[[example]]
name = "03_paints"
path = "examples/03_paints.rs"

[[example]]
name = "04_layers_clipping"
path = "examples/04_layers_clipping.rs"

[[example]]
name = "05_text_rendering"
path = "examples/05_text_rendering.rs"

[[example]]
name = "06_headless_full"
path = "examples/06_headless_full.rs"
